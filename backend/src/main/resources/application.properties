spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/obs}
spring.datasource.username=${DB_USERNAME:obs}
spring.datasource.password=${DB_PASSWORD:obs}

spring.flyway.locations=classpath:db/migration

# Bootstrap admin account (V2 migration). Throwaway local-demo values, same
# convention as the datasource credentials and JWT secret above — override
# via ADMIN_BOOTSTRAP_PASSWORD_HASH / ADMIN_BOOTSTRAP_EMAIL / ADMIN_BOOTSTRAP_PHONE
# for anything beyond a local run. The hash below is bcrypt("ChangeMe123!").
# Email is the admin login identifier (US-010); phone is still required so
# SMS-based 2FA (US-012) has somewhere to send the code.
spring.flyway.placeholders.adminPasswordHash=${ADMIN_BOOTSTRAP_PASSWORD_HASH:$2a$10$CPvFtm.yHrdrzSprtnnBueL/7ElKS8l65dN1LvRN1SXvgGiHxc/wy}
spring.flyway.placeholders.adminEmail=${ADMIN_BOOTSTRAP_EMAIL:admin@obs.local}
spring.flyway.placeholders.adminPhone=${ADMIN_BOOTSTRAP_PHONE:+855000000000}

# Throwaway local-demo signing key (same convention as the datasource credentials above).
# Override via JWT_SECRET for anything beyond a local run.
jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd}
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:7d}
# Challenge token: issued by /auth/login, exchanged for real tokens at
# /auth/2fa/verify (US-011/US-012). Short-lived by design.
jwt.challenge-token-ttl=${JWT_CHALLENGE_TOKEN_TTL:5m}

# Local demo only — makes @Profile("dev") beans (e.g. the log-only OTP SMS
# sender) active without extra setup. See sprint-plan.md's OTP & SMS note.
spring.profiles.active=dev

# web-admin dev server origin, for CORS (US-002/US-010). Override if you run
# Vite on a non-default port.
web-admin.origin=${WEB_ADMIN_ORIGIN:http://localhost:5173}

