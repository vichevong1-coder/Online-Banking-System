# Test-only datasource. Overrides the local Postgres the dev profile points at, so the suite owns
# a disposable database instead of whatever happens to be in the developer's.
#
# The jdbc:tc: URL is Testcontainers' JDBC support: it starts the container on first connection and
# stops it when the JVM exits, so no per-class container wiring is needed. TC_DAEMON keeps one
# container alive for the whole run rather than one per context.
spring.datasource.url=jdbc:tc:postgresql:17-alpine:///obs?TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=obs
spring.datasource.password=obs
