name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # No postgres service and no DB_* environment. The suite starts its own
    # throwaway Postgres through Testcontainers (see
    # backend/src/test/resources/application-test.properties), so a service
    # container here would sit unused while the tests talked to a different
    # database than the one CI provisioned. GitHub-hosted runners ship with a
    # working Docker daemon, which is all Testcontainers needs.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test
